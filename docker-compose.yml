version: '3.8'

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=8000
    volumes:
      - ./loan_applications.db:/app/loan_applications.db
    depends_on:
      - db
    networks:
      - loan-network
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - API_URL=http://fastapi:8000
    depends_on:
      - fastapi
    networks:
      - loan-network
    restart: unless-stopped

  db:
    image: sqlite:latest
    volumes:
      - db_data:/data
    networks:
      - loan-network

volumes:
  db_data:

networks:
  loan-network:
    driver: bridge
